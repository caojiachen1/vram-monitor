[package]
name = "vram-monitor"
version = "0.1.0"
description = "Real-time GPU VRAM monitor"
edition = "2021"

[lib]
name = "vram_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.10"
tauri-plugin-frameless-titlebar = { path = "../third_party/tauri-plugin-custom-titlebar" }

[profile.release]
strip = true
lto = true
codegen-units = 1
